name: Build

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualButtons
          path: app/build/outputs/apk/debug/VirtualButtons.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VirtualButtons
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/VirtualButtons.apk
          draft: false
          prerelease: false
          tag_name: latest
          name: "Latest Build"
          body: "Direct download: VirtualButtons.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}