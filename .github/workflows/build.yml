name: Build

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualButtons
          path: app/build/outputs/apk/debug/VirtualButtons.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VirtualButtons
          path: ./apk

      - name: Copy APK to release branch
        run: |
          git fetch origin +refs/heads/releases:refs/heads/releases || true
          git checkout releases 2>/dev/null || git checkout --orphan releases
          cp ./apk/VirtualButtons.apk ./VirtualButtons.apk
          git add VirtualButtons.apk
          git -c user.email=action@github.com -c user.name="GitHub Action" commit -m "Release APK" || exit 0
          git push -f origin releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/VirtualButtons.apk
          draft: false
          prerelease: false
          tag_name: latest
          name: "Virtual Buttons v1.0.1"
          body: |
            Latest build
            
            Download: VirtualButtons.apk
            
            Direct install URL:
            https://raw.githubusercontent.com/RG-Builder/Virtual-buttons/releases/VirtualButtons.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}